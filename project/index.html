<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Shapes Showcase</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Canvas for shape animation -->
        <canvas id="shapesCanvas"></canvas>

        <!-- Control Panel -->
        <div class="control-panel">
            <h2>Shape Sandbox</h2>
            
            <div class="control-group">
                <label for="shapeCount">Shape Count: <span id="countVal">50</span></label>
                <input type="range" id="shapeCount" min="5" max="200" value="50">
            </div>

            <div class="control-group">
                <label for="baseSpeed">Max Speed: <span id="speedVal">3</span></label>
                <input type="range" id="baseSpeed" min="1" max="15" value="4" step="0.5">
            </div>

            <div class="control-group">
                <label for="shapeSize">Size Scale: <span id="sizeVal">1.0</span></label>
                <input type="range" id="shapeSize" min="0.2" max="3" value="1" step="0.1">
            </div>

            <div class="control-row">
                <div class="control-group half">
                    <label for="boundaryMode">Boundary</label>
                    <select id="boundaryMode">
                        <option value="bounce">Bounce</option>
                        <option value="wrap">Wrap</option>
                    </select>
                </div>

                <div class="control-group half">
                    <label for="colorTheme">Theme</label>
                    <select id="colorTheme">
                        <option value="neon">Neon Nights</option>
                        <option value="pastel">Pastel Dream</option>
                        <option value="sunset">Sunset Glow</option>
                        <option value="ocean">Deep Ocean</option>
                    </select>
                </div>
            </div>

            <div class="shape-selectors">
                <label>Active Shapes:</label>
                <div class="checkbox-grid">
                    <label class="checkbox-container">
                        <input type="checkbox" id="chkCircle" checked>
                        <span class="checkmark"></span> Circle
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chkSquare" checked>
                        <span class="checkmark"></span> Square
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chkTriangle" checked>
                        <span class="checkmark"></span> Triangle
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chkPentagon" checked>
                        <span class="checkmark"></span> Pentagon
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chkStar" checked>
                        <span class="checkmark"></span> Star
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chkHeart" checked>
                        <span class="checkmark"></span> Heart
                    </label>
                </div>
            </div>

            <div class="action-buttons">
                <button id="btnPause" class="btn">Pause</button>
                <button id="btnReset" class="btn btn-secondary">Scramble</button>
            </div>
            
            <div class="fps-counter">FPS: <span id="fps">0</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
